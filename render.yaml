services:
  # Production API for the Jibunai app. Deploys backend/ (the one true Django
  # API per SOURCE_OF_TRUTH.md). Secrets are set in the Render dashboard,
  # never in this file.
  - type: web
    name: jibunai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn soul.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DJANGO_DEBUG
        value: "0"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        sync: false
      - key: ALLOWED_HOSTS_EXTRA
        sync: false
      - key: CSRF_EXTRA_ORIGINS
        sync: false
      - key: CORS_EXTRA_ORIGINS
        sync: false
