<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Archana's private area — projects, notes, goals, gallery and more." />

    
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Archana" />

    <title>Archana's Secret Space</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        background-color: #f6f5f0;
        color: #1a1a2e;
        font-family: 'DM Sans', system-ui, sans-serif;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f6f5f0;
      }
      #boot .dot {
        width: 14px; height: 14px; border-radius: 50%;
        background: #2d6a4f;
        animation: bootPulse 1.4s ease-in-out infinite;
      }
      #boot .label {
        font-size: 0.72rem; font-weight: 700; letter-spacing: 3px;
        text-transform: uppercase; color: #7a7567;
      }
      @keyframes bootPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.8); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="dot"></div>
        <div class="label">Loading your space…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
